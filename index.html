      <div class="info-grid"><div><span class="label">CREF</span><b>${esc(u.cref || "não informado")}</b></div><div><span class="label">Validade</span><b class="num">${u.cref_validade ? fmtData(u.cref_validade) : "não informada"}</b></div><div><span class="label">Cadastro</span><b class="num">${u.created_at ? fmtData(u.created_at) : "–"}</b></div></div>
      <div class="row">${crefChip(u)}${st === "ativo" && u.cref_conferido === false ? `<span class="chip warn">CREF atualizado pelo personal · conferir</span>` : ""}</div>
      ${u.cref_foto ? (fotos[u.id] === undefined ? `<div><button class="btn sm" data-act="verCref" data-id="${esc(u.id)}">Ver foto do CREF</button></div>` : foto) : `<p class="small" style="color:var(--warn)">Ainda não enviou a foto do CREF.</p>`}
      <div class="row">${acoes}</div>${exclusao}</div>`;
  };
  const grupo = (titulo, arr, vazio) => `<h2>${titulo} <span class="muted num">(${arr.length})</span></h2>${arr.length ? arr.map(card).join("") : `<div class="empty">${vazio}</div>`}`;
  return `<div><p class="label">Login mestre</p><h1>Personais</h1><p class="muted">Confira o número, a validade e a foto do CREF antes de aprovar. Os aprovados aparecem do CREF que vence primeiro para o último. Cada personal só vê os próprios alunos.</p></div>
    ${grupo("Aguardando aprovação", lista.filter(u => statusDe(u) === "pendente"), "Nenhum cadastro aguardando.")}
    ${grupo("Aprovados", lista.filter(u => statusDe(u) === "ativo").sort((a, b) => (diasPara(a.cref_validade) ?? -1e9) - (diasPara(b.cref_validade) ?? -1e9)), "Nenhum personal aprovado ainda.")}
    ${lista.some(u => statusDe(u) === "recusado") ? grupo("Recusados", lista.filter(u => statusDe(u) === "recusado"), "") : ""}`;
}

/* ---------- Orientações ---------- */
function viewOrientacoes(){
  const p = S.data.programa;
  const blocos = ORIENTACOES.map(b => `<section class="panel"><h2>${esc(b.titulo)}</h2><div>${b.itens.map(([k, v]) => `<div class="ori"><b>${esc(k)}</b><p>${esc(k === "Reavaliação" && p?.reavaliacao ? `Ao final do bloco, em ${fmtData(p.reavaliacao)}.` : k === "Profissional" && PROF && PROF.role !== "master" ? profLinha(profDe(PROF)) : v)}</p></div>`).join("")}</div></section>`).join("");
  return `<div><p class="label">Leia antes de treinar</p><h1>Orientações</h1></div>
    <section class="panel"><h2>O sistema de cores</h2><p>A cor de cada série diz a intensidade dela: quanto mais escura, mais pesada. O descanso depois da série segue a cor; o exercício avisa quando for diferente.</p>${legendaTipos(false)}
      <p class="small muted">Registre carga e repetições apenas nas séries de trabalho. Aquecimento e reconhecimento não entram nos registros.</p></section>
    ${blocos}`;
}
function saveBar(){
  return `<div class="savebar"><div class="wrap"><span class="small muted num">Treino ${esc(S.p.letra)} · Semana ${S.p.semana}</span><span class="spacer"></span><button class="btn primary" data-act="saveTreino">Salvar treino</button></div></div>`;
}

/* ---------- Evolução: acompanhamento de cargas (regras da skill registro-semanal-cargas) ---------- */
const range = (a, b) => Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);
const repsLbl = r => r?.reps_txt || (r?.reps ?? "–");
const vlSerie = r => (r && r.carga != null && r.reps != null) ? Number(r.carga) * Number(r.reps) : null;
const sinal = n => n > 0 ? "+" + n : String(n);
const corPts = n => n > 0 ? "var(--up)" : n < 0 ? "var(--down)" : "inherit";
const pctTxt = (a, b) => a ? `${b >= a ? "+" : ""}${fmt(Math.round((b - a) / a * 1000) / 10)}%` : "";
function cellSet(r){
  if (!r || (r.carga == null && r.reps == null)) return `<span class="muted">–</span>`;
  const main = `${r.carga != null ? fmt(r.carga) : "–"} kg × ${esc(repsLbl(r))}`;
  return r.reps_txt && vlSerie(r) != null ? `${main}<span class="sub">${r.reps} reps somadas · ${fmtKg(vlSerie(r))} kg</span>` : main;
}
/* Pontos de evolução: mesma série da semana anterior */
function pontoSerie(a, b){
  if (!a || !b || a.carga == null || b.carga == null || a.reps == null || b.reps == null) return null;
  const ca = Number(a.carga), cb = Number(b.carga);
  if (cb > ca) return { p: 1, s: "▲ carga", c: "ok" };
  if (cb < ca) return { p: -1, s: "▼ carga", c: "bad" };
  if (Number(b.reps) > Number(a.reps)) return { p: 1, s: "▲ reps", c: "ok" };
  if (Number(b.reps) < Number(a.reps)) return { p: -1, s: "▼ reps", c: "bad" };
  return { p: 0, s: "= igual", c: "" };
}
function subTabs(key, opts, def){
  const v = opts.some(o => o.v === S.p[key]) ? S.p[key] : def;
  return { v, html: `<div class="tabs sub" role="tablist">${opts.map(o => `<button role="tab" data-act="sub" data-k="${key}" data-v="${esc(o.v)}" aria-selected="${o.v === v}">${esc(o.l)}</button>`).join("")}</div>` };
}
const tile = (lbl, val, sub, cls = "") => `<div class="tile ${cls}"><span class="label">${lbl}</span><b class="num">${val}</b>${sub ? `<span class="small muted num">${sub}</span>` : ""}</div>`;

function evolucao(ctx){
  const { prog, regs, exercicios } = ctx;
  const modo = ctx.modo, proprio = modo === "proprio", paraAluno = modo === "aluno", editavel = !!ctx.editavel;
  const obs = ctx.obs || {};
  const pf = ctx.prof || PROF_PADRAO;
  const exMap = Object.fromEntries(exercicios.map(e => [e.id, e]));
  const nomeEx = id => exMap[id]?.nome || "Exercício";
  const treinos = prog.treinos.filter(t => t.itens.length);
  const N = prog.semanas, cur = ctx.cur || semanaAtual(prog);
  if (!regs.length || !treinos.length) return `<div class="empty">Ainda não há nenhum treino registrado neste programa.</div>`;
  const de = Math.max(1, ctx.de || 1);
  const feito = (w, l) => w >= de && regs.some(r => r.semana === w && r.letra === l);
  const F = (w, l, ex, s) => w < de ? undefined : regs.find(r => r.semana === w && r.letra === l && r.exercicio_id === ex && r.serie === s);
  const vlT = (w, l) => volume(regs.filter(r => r.semana === w && r.letra === l));
  const vlW = w => volume(regs.filter(r => r.semana === w));
  const vlEx = (w, l, ex) => { const rs = regs.filter(r => r.semana === w && r.letra === l && r.exercicio_id === ex); return rs.length ? volume(rs) : null; };
  const semanasReg = [...new Set(regs.map(r => r.semana))].filter(w => w >= de && (!ctx.ate || w <= ctx.ate)).sort((a, b) => a - b);
  if (!semanasReg.length) return `<div class="empty">Nenhum treino registrado nas semanas selecionadas.</div>`;
  const ultima = semanasReg[semanasReg.length - 1];
  const semanas = range(de, ultima);
  const periodo = de === ultima ? `semana ${de}` : `semanas ${de} a ${ultima}`;
  const ptsEx = (w, t, it) => {
    if (w <= de || !feito(w, t.letra) || !feito(w - 1, t.letra)) return null;
    let s = 0, any = false;
    serT(it).forEach(k => { const p = pontoSerie(F(w - 1, t.letra, it.exercicio_id, k), F(w, t.letra, it.exercicio_id, k)); if (p) { s += p.p; any = true; } });
    return any ? s : null;
  };
  const ptsTreino = (w, t) => (w <= de || !feito(w, t.letra) || !feito(w - 1, t.letra)) ? null : t.itens.reduce((s, it) => s + (ptsEx(w, t, it) || 0), 0);
  const ptsSemana = w => treinos.reduce((s, t) => s + (ptsTreino(w, t) || 0), 0);
  const ausente = (w, l) => !feito(w, l) && w < cur;
  const statusTxt = (w, l) => ausente(w, l) ? `ausência na semana ${w}` : `ainda não registrado na semana ${w}`;
  const T = (a, t) => proprio ? t : a;
  const obsBox = k => editavel
    ? `<label class="field obsf"><span>Minhas observações</span><textarea id="obs-${k}" data-obs="${k}" placeholder="${proprio ? "Anotações sobre esta parte." : "O que você quer comentar sobre esta parte. Vai junto quando você enviar ao aluno."}">${esc(obs[k] || "")}</textarea></label>`
    : (obs[k] ? `<div class="obs-pt"><span class="label">Observações de ${esc(primeiroNome(pf.nome))}</span><p>${esc(obs[k]).replace(/\n/g, "<br>")}</p></div>` : "");
  const sec = (n, k, titulo, corpo) => `<section class="panel" id="sec-${k}"><div><p class="sec-n">${n}</p><h2>${titulo}</h2></div>${corpo}${obsBox(k)}</section>`;
  const wTabs = (key, extra) => subTabs(key, [...semanas.map(w => ({ v: String(w), l: `Semana ${w}` })), ...(extra ? [extra] : [])], String(ultima));
  const tTabs = (key, extra) => subTabs(key, [...treinos.map(t => ({ v: t.letra, l: `Treino ${t.letra}` })), ...(extra ? [extra] : [])], treinos[0].letra);

  /* Conferência — só o personal vê, nunca vai para o aluno */
  let conf = "";
  if (!paraAluno) {
    const falt = regs.filter(r => (r.carga == null) !== (r.reps == null)).sort((a, b) => a.semana - b.semana || a.letra.localeCompare(b.letra) || a.serie - b.serie);
    S.data.falt = falt;
    const sumiu = [];
    semanasReg.forEach(w => treinos.forEach(t => {
      if (!feito(w, t.letra)) return;
      t.itens.forEach(it => { if (!regs.some(r => r.semana === w && r.letra === t.letra && r.exercicio_id === it.exercicio_id)) sumiu.push(`Semana ${w}, treino ${t.letra}: ${esc(nomeEx(it.exercicio_id))} ficou sem registro num treino realizado. Confirme o motivo antes de tratar como queda.`); });
    }));
    const notas = (ctx.sess || []).filter(x => x.obs && x.semana >= de).sort((a, b) => b.semana - a.semana || a.letra.localeCompare(b.letra));
    if (notas.length) sumiu.push(...notas.slice(0, 6).map(x => `<div class="sess-note"><b>Observação do aluno · semana ${x.semana}, treino ${x.letra}:</b> ${esc(x.obs)}</div>`));
    if (falt.length || sumiu.length) conf = `<div class="callout"><b>Conferência</b>
      ${falt.map((r, k) => `<div style="margin-top:8px">Semana ${r.semana}, treino ${r.letra}, ${esc(nomeEx(r.exercicio_id))}, série ${r.serie}: falta ${r.carga == null ? "a carga" : "o número de repetições"}. Fica fora das contas até ser lançado.
        <div class="fix"><input id="fix-${k}" type="text" inputmode="${r.carga == null ? "decimal" : "tel"}" placeholder="${r.carga == null ? "kg" : "reps"}" aria-label="Valor que falta"><button class="btn sm" data-act="fixReg" data-k="${k}">Lançar</button></div></div>`).join("")}
      ${sumiu.map(s => `<div style="margin-top:8px">${s}</div>`).join("")}</div>`;
  }

  /* Topo */
  const topo = `<section class="panel rep-head">
      <div class="row">${MARK(34)}<div><div style="font-weight:500;letter-spacing:.06em;text-transform:uppercase">${esc(pf.nome.split(" ").slice(0, -1).join(" "))} <b style="font-weight:800">${esc(pf.nome.split(" ").slice(-1)[0])}</b></div><span class="sub" style="letter-spacing:.22em">PERSONAL TRAINER${pf.cref ? " · CREF " + esc(pf.cref) : ""}</span></div></div>
      <h2>${proprio ? "Registro do meu treino" : "Acompanhamento de cargas"} · ${esc(prog.nome)}</h2>
      ${proprio ? "" : `<span class="selo">Modalidade · ${esc(prog.modalidade)}</span>`}
      <p>Período: <b>${periodo}</b> (programa de ${N} semanas).${de > 1 ? ` A semana ${de} é o ponto de partida: as comparações começam na semana ${de + 1}.` : ""} ${T("Em cada parte, toque na semana ou no treino que quer ver. Toda comparação é feita com a semana anterior.", "Comparações sempre contra a semana anterior.")}</p>
      <div class="legend"><span><i style="background:var(--prev)"></i>Semana anterior</span><span><i style="background:var(--cur)"></i>Semana analisada</span><span><i style="border:1.5px dashed var(--muted)"></i>Não registrado</span><span style="color:var(--up)">▲ subiu</span><span>= manteve</span><span style="color:var(--down)">▼ caiu</span></div>
    </section>`;

  /* 01 · A medida */
  const exRow = regs.find(r => r.semana === ultima && vlSerie(r) != null);
  const exemplo = exRow ? `<p class="obs num">Exemplo da semana ${ultima}: ${esc(nomeEx(exRow.exercicio_id))}, série ${exRow.serie} → ${fmt(exRow.carga)} kg × ${exRow.reps}${exRow.reps_txt ? ` (${esc(exRow.reps_txt)})` : ""} = <b>${fmtKg(vlSerie(exRow))} kg</b></p>` : "";
  const s1 = sec("01 · A medida", "medida", "Volume load", T(
    `<p><b>Volume load = carga × repetições</b>, somado em todas as séries de trabalho (aquecimento não entra).</p>${exemplo}
     <p><b>Para que serve:</b> mostrar quanto trabalho você fez em cada exercício, treino e semana, e acompanhar isso ao longo do programa.</p>
     <p><b>Para que não serve:</b> dizer sozinho se o treino foi melhor ou pior. Se a carga sobe e as repetições caem, o volume pode diminuir e mesmo assim ser evolução. Por isso carga e repetições aparecem sempre separadas, e o volume load é uma terceira informação.</p>`,
    `<p><b>VL = Σ (carga × reps)</b> das séries de trabalho.</p>${exemplo}
     <p>Indicador de trabalho mecânico total. Não mede intensidade relativa nem qualidade técnica; carga e reps reportadas em separado.</p>`));

  /* 02 · Panorama — por semana + geral */
  const pan = wTabs("pan", { v: "geral", l: "Geral" });
  let panBody;
  if (pan.v === "geral") {
    const tiles = semanas.map(w => semanasReg.includes(w)
      ? tile(`Semana ${w}`, `${fmtKg(vlW(w))} kg`, `${treinos.filter(t => feito(w, t.letra)).length} de ${treinos.length} treinos`)
      : tile(`Semana ${w}`, "–", "sem registro")).join("");
    const head = `<tr><th>Treino</th>${semanas.map(w => `<th class="c">S${w}</th>`).join("")}<th>Primeira → última</th></tr>`;
    const linhas = treinos.map(t => {
      const sw = semanas.filter(w => feito(w, t.letra));
      const ev = sw.length >= 2 ? `${fmtKg(vlT(sw[0], t.letra))} → ${fmtKg(vlT(sw[sw.length - 1], t.letra))} kg <span class="muted">(${pctTxt(vlT(sw[0], t.letra), vlT(sw[sw.length - 1], t.letra))})</span>` : "–";
      return `<tr><td>${t.letra} · ${esc(t.nome)}</td>${semanas.map(w => `<td class="c">${feito(w, t.letra) ? fmtKg(vlT(w, t.letra)) : `<span class="muted small">${ausente(w, t.letra) ? "aus." : "–"}</span>`}</td>`).join("")}<td>${ev}</td></tr>`;
    }).join("");
    const total = `<tr><td><b>Total realizado</b></td>${semanas.map(w => `<td class="c"><b>${semanasReg.includes(w) ? fmtKg(vlW(w)) : "–"}</b></td>`).join("")}<td></td></tr>`;
    const nAus = treinos.reduce((s, t) => s + semanas.filter(w => ausente(w, t.letra)).length, 0);
    panBody = `<p>${T(`Visão de todo o período. ${de === ultima ? "Na" : "Nas"} ${periodo} foram ${semanas.reduce((s, w) => s + treinos.filter(t => feito(w, t.letra)).length, 0)} treinos realizados${nAus ? ` e ${nAus} ${nAus === 1 ? "ausência" : "ausências"}` : ""}.`, `Consolidado: ${periodo}.`)}</p>
      <div class="tiles">${tiles}</div>
      <div class="chart">${weekBars(semanas.map(w => ({ label: "S" + w, v: semanasReg.includes(w) ? vlW(w) : null, col: w === ultima ? "var(--cur)" : "var(--prev)" })), "Volume load total por semana")}</div>
      <div class="tbl-wrap"><table class="data"><thead>${head}</thead><tbody>${linhas}${total}</tbody></table></div>
      <p class="small muted">Valores em kg. "aus." = ausência (não é zero nem queda de desempenho).</p>`;
  } else {
    const w = Number(pan.v), p = w - 1, tem = p >= de;
    const comuns = tem ? treinos.filter(t => feito(w, t.letra) && feito(p, t.letra)) : [];
    const compA = comuns.reduce((s, t) => s + vlT(p, t.letra), 0), compB = comuns.reduce((s, t) => s + vlT(w, t.letra), 0);
    const nW = treinos.filter(t => feito(w, t.letra)).length;
    const faltando = treinos.filter(t => !feito(w, t.letra));
    const tiles = [
      tile(`Realizado · semana ${w}`, `${fmtKg(vlW(w))} kg`, `${nW} de ${treinos.length} treinos`, "cur"),
      tem && comuns.length ? tile(`Comparável · ${comuns.map(t => t.letra).join(", ")}`, `${fmtKg(compA)} → ${fmtKg(compB)} kg`, pctTxt(compA, compB) + ` vs semana ${p}`) : "",
      tem ? tile(`Pontos · semana ${w}`, `<span style="color:${corPts(ptsSemana(w))}">${sinal(ptsSemana(w))}</span>`, "pontos de evolução") : ""
    ].join("");
    const tbl = `<div class="tbl-wrap"><table class="data"><thead><tr><th>Treino</th>${tem ? `<th>Semana ${p}</th>` : ""}<th>Semana ${w}</th>${tem ? "<th>Variação</th>" : ""}</tr></thead><tbody>${treinos.map(t => {
      const b = feito(w, t.letra) ? `${fmtKg(vlT(w, t.letra))} kg` : `<span class="muted">${ausente(w, t.letra) ? "ausência" : "não registrado"}</span>`;
      const a = !tem ? null : feito(p, t.letra) ? `${fmtKg(vlT(p, t.letra))} kg` : `<span class="muted">${ausente(p, t.letra) ? "ausência" : "não registrado"}</span>`;
      const v = tem && feito(w, t.letra) && feito(p, t.letra) ? pctTxt(vlT(p, t.letra), vlT(w, t.letra)) : "–";
      return `<tr><td>${t.letra} · ${esc(t.nome)}</td>${tem ? `<td class="num">${a}</td>` : ""}<td class="num"><b>${b}</b></td>${tem ? `<td class="num">${v}</td>` : ""}</tr>`;
    }).join("")}</tbody></table></div>`;
    panBody = `<p>${tem ? `Semana ${w} comparada com a semana ${p}.` : `Semana ${w}: ponto de partida, sem comparação.`}</p>
      <div class="tiles">${tiles}</div>
      ${faltando.length ? `<p class="small muted">${faltando.map(t => `Treino ${t.letra}: ${statusTxt(w, t.letra)}.`).join(" ")}</p>` : ""}
      <div class="chart">${groupedBars(treinos.map(t => ({ label: "Treino " + t.letra, a: tem ? (feito(p, t.letra) ? vlT(p, t.letra) : null) : undefined, b: feito(w, t.letra) ? vlT(w, t.letra) : null })), { aName: `Semana ${p}`, bName: `Semana ${w}`, label: "Volume load por treino" })}</div>
      ${tbl}`;
  }
  const s2 = sec("02 · Panorama", "panorama", "Volume load por semana", pan.html + panBody);

  /* 03 · Detalhe — por treino, em todas as semanas */
  const dt = tTabs("det");
  const td = treinos.find(x => x.letra === dt.v);
  const semT = semanas.filter(w => feito(w, td.letra));
  const lastT = semT[semT.length - 1];
  let detBody;
  if (!semT.length) detBody = `<p class="muted">Treino ${td.letra} ainda sem registro.</p>`;
  else {
    detBody = td.itens.map((it, i) => {
      const ks = serT(it), nS = ks.length;
      const bars = semanas.map(w => ({ label: "S" + w, v: feito(w, td.letra) ? vlEx(w, td.letra, it.exercicio_id) : null, col: w === lastT ? "var(--cur)" : "var(--prev)" }));
      const rows = semanas.map(w => {
        if (!feito(w, td.letra)) return `<tr><td class="num"><b>S${w}</b></td><td colspan="${nS + 1}" class="muted small">${ausente(w, td.letra) ? "Ausência" : "Ainda não registrado"}</td></tr>`;
        const cells = ks.map(k => {
          const b = F(w, td.letra, it.exercicio_id, k), a = w > de && feito(w - 1, td.letra) ? F(w - 1, td.letra, it.exercicio_id, k) : null, p = pontoSerie(a, b);
          const tag = w === de || !b ? "" : !a ? `<span class="sub">linha de base</span>` : p ? `<span class="sub" style="color:${corPts(p.p)}">${p.s}</span>` : "";
          return `<td>${cellSet(b)}${tag}</td>`;
        }).join("");
        const v = vlEx(w, td.letra, it.exercicio_id);
        return `<tr><td class="num"><b>S${w}</b></td>${cells}<td class="num">${v != null ? fmtKg(v) + " kg" : "–"}</td></tr>`;
      }).join("");
      return `<div class="exd"><h4>${i + 1}. ${esc(nomeEx(it.exercicio_id))}</h4><div class="ex-detail"><div class="chart">${weekBars(bars, "Volume load do exercício por semana", 150)}</div>
        <div class="tbl-wrap"><table class="data"><thead><tr><th>Semana</th>${ks.map(k => `<th>Trab. ${k}</th>`).join("")}<th>Volume</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
    }).join("");
    const pT = lastT - 1;
    detBody += `<div class="exd tot-blk"><h4>Treino ${td.letra} completo</h4><div class="chart">${weekBars(semanas.map(w => ({ label: "S" + w, v: feito(w, td.letra) ? vlT(w, td.letra) : null, col: w === lastT ? "var(--cur)" : "var(--prev)" })), "Volume load do treino por semana")}</div>
      <p class="tot num">${pT >= de && feito(pT, td.letra) ? `Semana ${pT}: <b>${fmtKg(vlT(pT, td.letra))} kg</b> → ` : ""}semana ${lastT}: <b>${fmtKg(vlT(lastT, td.letra))} kg</b></p></div>`;
  }
  const notasT = paraAluno ? [] : (ctx.sess || []).filter(x => x.letra === td.letra && x.obs && x.semana >= de).sort((a, b) => a.semana - b.semana);
  if (notasT.length) detBody += `<div class="exd"><h4>Observações do aluno nas sessões</h4>${notasT.map(x => `<div class="sess-note"><b>Semana ${x.semana}:</b> ${esc(x.obs)}</div>`).join("")}</div>`;
  const s3 = sec("03 · Detalhe", "detalhe", "Treino a treino, semana a semana", dt.html + `<h3>Treino ${td.letra}${td.nome ? " · " + esc(td.nome) : ""}</h3><p class="small muted">${T("Cada série é comparada com a mesma série da semana anterior. Carga e repetições aparecem separadas.", "Série n vs série n da semana anterior.")}</p>` + detBody);

  /* 04 · O ciclo — por treino + todos */
  const ct = tTabs("cic", { v: "todos", l: "Todos" });
  const serieT = t => range(1, ultima).map(w => w < de ? undefined : feito(w, t.letra) ? vlT(w, t.letra) : null);
  let cicBody;
  if (ct.v === "todos") {
    const allV = treinos.flatMap(serieT).filter(v => v != null);
    const mx = Math.max(1, ...allV), st = niceStep(mx / 2), top = Math.ceil(mx / st) * st;
    cicBody = `<p class="small muted">Todos os treinos na mesma escala. Ponto vazado tracejado = ausência. Faixa sombreada = semanas aguardando registro.</p>
      <div class="multiples">${treinos.map(t => `<div class="mult"><h4>Treino ${t.letra}${t.nome ? " · " + esc(t.nome) : ""}</h4><div class="chart">${cicloSVG(serieT(t), N, ultima, top, st, `Treino ${t.letra}`)}</div></div>`).join("")}</div>`;
  } else {
    const t = treinos.find(x => x.letra === ct.v);
    const vT = serieT(t), mxT = Math.max(1, ...vT.filter(v => v != null)), stT = niceStep(mxT / 3), topT = Math.ceil(mxT / stT) * stT;
    const serieE = it => range(1, ultima).map(w => w < de ? undefined : feito(w, t.letra) ? (vlEx(w, t.letra, it.exercicio_id) ?? 0) : null);
    const allE = t.itens.flatMap(serieE).filter(v => v != null);
    const mxE = Math.max(1, ...allE), stE = niceStep(mxE / 2), topE = Math.ceil(mxE / stE) * stE;
    cicBody = `<h3>Treino ${t.letra}${t.nome ? " · " + esc(t.nome) : ""} nas ${N} semanas</h3>
      <div class="chart">${cicloSVG(vT, N, ultima, topT, stT, `Treino ${t.letra}`, 420)}</div>
      <p class="small muted">Cada exercício do treino, na mesma escala:</p>
      <div class="multiples">${t.itens.map((it, i) => `<div class="mult"><h4>${i + 1}. ${esc(nomeEx(it.exercicio_id))}</h4><div class="chart">${cicloSVG(serieE(it), N, ultima, topE, stE, nomeEx(it.exercicio_id))}</div></div>`).join("")}</div>`;
  }
  const s4 = sec("04 · O ciclo", "ciclo", `Volume load nas ${N} semanas`, ct.html + cicBody);

  /* 05 · Pontuação — tabela de regras, por semana + geral */
  const regras = `<div class="tbl-wrap"><table class="data"><thead><tr><th>Situação (mesma série, semana anterior)</th><th class="c">Pontos</th></tr></thead><tbody>
    <tr><td>A carga subiu (repetições não contam nessa série)</td><td class="c" style="color:var(--up)"><b>+1</b></td></tr>
    <tr><td>Mesma carga, mais repetições</td><td class="c" style="color:var(--up)"><b>+1</b></td></tr>
    <tr><td>Mesma carga, mesmas repetições</td><td class="c"><b>0</b></td></tr>
    <tr><td>A carga caiu (repetições não contam)</td><td class="c" style="color:var(--down)"><b>−1</b></td></tr>
    <tr><td>Mesma carga, menos repetições</td><td class="c" style="color:var(--down)"><b>−1</b></td></tr>
    <tr><td>Série sem par na semana anterior · ausência</td><td class="c muted">não pontua</td></tr></tbody></table></div>`;
  const pt = wTabs("pts", { v: "geral", l: "Geral" });
  let ptsBody;
  if (pt.v === "geral") {
    const ws = range(de + 1, ultima);
    if (!ws.length) ptsBody = `<p>Sem comparações neste período: a semana ${de} vale zero, é o ponto de partida.</p>`;
    else {
      let acc = 0;
      const head = `<tr><th>Treino</th>${ws.map(w => `<th class="c">S${w}</th>`).join("")}<th class="c">Total</th></tr>`;
      const linhas = treinos.map(t => { const v = ws.map(w => ptsTreino(w, t)); const tot = v.reduce((s, x) => s + (x || 0), 0); return `<tr><td>${t.letra} · ${esc(t.nome)}</td>${v.map((x, i) => `<td class="c">${x == null ? `<span class="muted small" title="${statusTxt(feito(ws[i], t.letra) ? ws[i] - 1 : ws[i], t.letra)}">–</span>` : `<b style="color:${corPts(x)}">${sinal(x)}</b>`}</td>`).join("")}<td class="c"><b style="color:${corPts(tot)}">${sinal(tot)}</b></td></tr>`; }).join("");
      const totW = ws.map(w => ptsSemana(w));
      const total = `<tr><td><b>Saldo da semana</b></td>${totW.map(x => `<td class="c"><b style="color:${corPts(x)}">${sinal(x)}</b></td>`).join("")}<td class="c"><b style="color:${corPts(totW.reduce((a, b) => a + b, 0))}">${sinal(totW.reduce((a, b) => a + b, 0))}</b></td></tr>`;
      const accRow = `<tr><td class="muted">Acumulado</td>${totW.map(x => `<td class="c muted">${sinal(acc += x)}</td>`).join("")}<td></td></tr>`;
      const porEx = treinos.map(t => `<div class="exd"><h4>Treino ${t.letra} · por exercício no ciclo</h4><div class="tbl-wrap"><table class="data"><thead><tr><th>Exercício</th>${ws.map(w => `<th class="c">S${w}</th>`).join("")}<th class="c">Total</th></tr></thead><tbody>${t.itens.map(it => { const v = ws.map(w => ptsEx(w, t, it)); const tot = v.reduce((s, x) => s + (x || 0), 0); return `<tr><td>${esc(nomeEx(it.exercicio_id))}</td>${v.map(x => `<td class="c">${x == null ? `<span class="muted">–</span>` : `<span style="color:${corPts(x)}">${sinal(x)}</span>`}</td>`).join("")}<td class="c"><b style="color:${corPts(tot)}">${sinal(tot)}</b></td></tr>`; }).join("")}</tbody></table></div></div>`).join("");
      ptsBody = `<p>Pontos de todas as semanas. A semana ${de} vale zero (ponto de partida); "–" = sem comparação naquela semana.</p>
        <div class="tbl-wrap"><table class="data"><thead>${head}</thead><tbody>${linhas}${total}${accRow}</tbody></table></div>${porEx}`;
    }
  } else {
    const w = Number(pt.v), p = w - 1;
    if (w === de) ptsBody = `<p>A semana ${de} vale zero: é o ponto de partida${de === 1 ? ", não há semana antes dela" : " deste período"}.</p>`;
    else ptsBody = `<p>Semana ${w} comparada com a semana ${p}.</p>` + treinos.map(t => {
      if (!feito(w, t.letra) || !feito(p, t.letra)) return `<p class="small muted"><b>Treino ${t.letra}:</b> sem comparação (${!feito(w, t.letra) ? statusTxt(w, t.letra) : statusTxt(p, t.letra)}). Não pontua e não perde pontos.</p>`;
      const maxS = Math.max(...t.itens.map(it => serT(it).length));
      const linhas = t.itens.map(it => {
        const cells = range(1, maxS).map(j => {
          const k = serT(it)[j - 1];
          if (k === undefined) return `<td class="c"></td>`;
          const a = F(p, t.letra, it.exercicio_id, k), q = pontoSerie(a, F(w, t.letra, it.exercicio_id, k));
          if (!a) return `<td class="c muted small">base</td>`;
          if (!q) return `<td class="c muted">–</td>`;
          return `<td class="c" style="color:${q.p > 0 ? "var(--up)" : q.p < 0 ? "var(--down)" : "var(--muted)"}">${q.s}</td>`;
        }).join("");
        const tot = ptsEx(w, t, it);
        return `<tr><td>${esc(nomeEx(it.exercicio_id))}</td>${cells}<td class="c"><b style="color:${corPts(tot || 0)}">${tot == null ? "–" : sinal(tot)}</b></td></tr>`;
      }).join("");
      return `<div class="exd"><h4>Treino ${t.letra} · ${esc(t.nome)} <span class="muted">· ${sinal(ptsTreino(w, t))} pts</span></h4><div class="tbl-wrap"><table class="data"><thead><tr><th>Exercício</th>${range(1, maxS).map(k => `<th class="c">Trab. ${k}</th>`).join("")}<th class="c">Pontos</th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
    }).join("") + `<p class="saldo num">Saldo da semana ${w}: <b style="color:${corPts(ptsSemana(w))}">${sinal(ptsSemana(w))} ${Math.abs(ptsSemana(w)) === 1 ? "ponto" : "pontos"}</b></p>`;
  }
  const s5 = sec("05 · Pontuação", "pontuacao", "Pontos de evolução", regras + pt.html + ptsBody);

  /* 06 · Fechamento */
  let acc = 0;
  const cum = range(1, N).map(w => w < de ? undefined : w <= ultima ? (acc += ptsSemana(w)) : null);
  const saldos = range(de + 1, ultima).map(w => `S${w} <b style="color:${corPts(ptsSemana(w))}">${sinal(ptsSemana(w))}</b>`).join(" · ");
  const s6 = sec("06 · Fechamento", "fechamento", `Pontos acumulados: ${sinal(acc)}`, `<p class="small muted">${T("A linha sobe quando a semana soma pontos, fica parada quando você mantém tudo e desce quando há recuo.", "Acumulado semanal. Ausência não pontua.")}</p>
    <div class="chart">${linhaPontos(cum, N, ultima)}</div>${saldos ? `<p class="small num">Saldo por semana: ${saldos}</p>` : ""}`);

  const rodape = `<footer class="rep-foot">${MARK(22)}<span>${esc(pf.nome)}${pf.cref ? " · CREF " + esc(pf.cref) : ""} · Números dos registros série a série do app, considerando apenas séries de trabalho. Fechamento em ${esc(ctx.data || new Date().toLocaleDateString("pt-BR"))}.</span></footer>`;
  return conf + topo + s1 + s2 + s3 + s4 + s5 + s6 + rodape;
}

/* ---------- Gráficos (SVG desenhado a partir dos registros) ---------- */
const svgOpen = (W, H, label) => `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" font-family="Manrope, system-ui, sans-serif" style="max-width:640px">`;
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x || 1))); const n = x / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function gridY(bot, top, st, y, pl, W, pr, f = fmtKg){
  let s = "";
  for (let v = bot; v <= top + 1e-9; v += st) s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.4 : 1}"/><text x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${f(v)}</text>`;
  return s;
}
function groupedBars(groups, o = {}){
  const W = 420, H = o.h || 190, pl = 44, pr = 8, pt = 16, pb = 26, iw = W - pl - pr, ih = H - pt - pb;
  const vals = groups.flatMap(g => [g.a, g.b]).filter(v => typeof v === "number");
  const max = Math.max(1, ...vals), st = niceStep(max / 3), top = Math.ceil(max / st) * st;
  const y = v => pt + ih - (v / top) * ih;
  const two = groups.some(g => g.a !== undefined);
  const gw = iw / groups.length, bw = Math.min(32, gw * 0.72 / (two ? 2 : 1));
  let s = gridY(0, top, st, y, pl, W, pr);
  groups.forEach((g, i) => {
    const cx = pl + gw * (i + .5);
    const slots = two ? [["a", -bw / 2 - 1, "var(--prev)", o.aName], ["b", bw / 2 + 1, "var(--cur)", o.bName]] : [["b", 0, "var(--cur)", o.bName]];
    slots.forEach(([k, off, col, nm]) => {
      const v = g[k], x = cx + off - bw / 2;
      if (v === undefined) return;
      if (v === null) { const hh = ih * .3; s += `<rect x="${x}" y="${pt + ih - hh}" width="${bw}" height="${hh}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"><title>${esc(g.label)} · ${esc(nm)}: não registrado</title></rect>`; return; }
      s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, pt + ih - y(v))}" rx="3" fill="${col}"><title>${esc(g.label)} · ${esc(nm)}: ${fmtKg(v)} kg</title></rect><text x="${x + bw / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--fg)">${fmtKg(v)}</text>`;
    });
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">${esc(g.label)}</text>`;
  });
  return svgOpen(W, H, o.label || "Volume load") + s + "</svg>";
}
function weekBars(items, label, h = 170){
  const W = 420, H = h, pl = 46, pr = 8, pt = 16, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const vals = items.map(i => i.v).filter(v => typeof v === "number");
  const max = Math.max(1, ...vals), st = niceStep(max / 3), top = Math.ceil(max / st) * st;
  const y = v => pt + ih - (v / top) * ih;
  const gw = iw / items.length, bw = Math.min(34, gw * 0.62);
  let s = gridY(0, top, st, y, pl, W, pr);
  items.forEach((it, i) => {
    const cx = pl + gw * (i + .5), x = cx - bw / 2;
    if (it.v === null) s += `<rect x="${x}" y="${pt + ih * .7}" width="${bw}" height="${ih * .3}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"><title>${esc(it.label)}: não registrado</title></rect>`;
    else s += `<rect x="${x}" y="${y(it.v)}" width="${bw}" height="${Math.max(0, pt + ih - y(it.v))}" rx="3" fill="${it.col}"><title>${esc(it.label)}: ${fmtKg(it.v)} kg</title></rect>${items.length <= 10 ? `<text x="${cx}" y="${y(it.v) - 4}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--fg)">${fmtKg(it.v)}</text>` : ""}`;
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)">${esc(it.label)}</text>`;
  });
  return svgOpen(W, H, label) + s + "</svg>";
}
/* vals[w-1] = número (registrado) ou null (ausência), até a última semana registrada */
function cicloSVG(vals, N, ultima, top, st, label, W = 280){
  const H = W > 300 ? 180 : 140, pl = 42, pr = 10, pt = 12, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
  const x = w => pl + (N === 1 ? iw / 2 : (w - 1) * iw / (N - 1));
  const y = v => pt + ih - (v / top) * ih;
  let s = "";
  if (ultima < N) { const x0 = (x(ultima) + x(ultima + 1)) / 2; s += `<rect x="${x0}" y="${pt}" width="${W - pr - x0}" height="${ih}" fill="var(--sunken)"/><text x="${(x0 + W - pr) / 2}" y="${pt + 12}" text-anchor="middle" font-size="9" fill="var(--muted)">aguardando registro</text>`; }
  s += gridY(0, top, st, y, pl, W, pr);
  range(1, N).forEach(w => s += `<text x="${x(w)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">S${w}</text>`);
  let lines = "", dots = "", last = null;
  vals.forEach((v, i) => {
    const w = i + 1;
    if (v === undefined) return;
    if (v != null) {
      const px = x(w), py = y(v);
      if (last && last.w === w - 1) lines += `<line x1="${last.x}" y1="${last.y}" x2="${px}" y2="${py}" stroke="var(--accent)" stroke-width="2"/>`;
      dots += `<circle cx="${px}" cy="${py}" r="3.6" fill="${w === ultima ? "var(--cur)" : "var(--accent)"}"><title>${esc(label)} · semana ${w}: ${fmtKg(v)} kg</title></circle>`;
      if (W > 300) dots += `<text x="${px}" y="${py - 8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--fg)">${fmtKg(v)}</text>`;
      last = { w, x: px, y: py };
    } else dots += `<circle cx="${x(w)}" cy="${pt + ih}" r="3.6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="2 2"><title>${esc(label)} · semana ${w}: ausência</title></circle>`;
  });
  return svgOpen(W, H, `${label} nas ${N} semanas`) + s + lines + dots + "</svg>";
}
function linhaPontos(cum, N, ultima){
  const W = 420, H = 190, pl = 36, pr = 16, pt = 22, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const vals = cum.filter(v => v != null);
  const mxv = Math.max(1, ...vals), mnv = Math.min(0, ...vals);
  const st = Math.max(1, niceStep((mxv - mnv) / 4)), top = Math.ceil(mxv / st) * st, bot = Math.floor(mnv / st) * st;
  const x = w => pl + (N === 1 ? iw / 2 : (w - 1) * iw / (N - 1)), y = v => pt + ih - (v - bot) / (top - bot || 1) * ih;
  let s = "";
  if (ultima < N) { const x0 = (x(ultima) + x(ultima + 1)) / 2; s += `<rect x="${x0}" y="${pt}" width="${W - pr - x0}" height="${ih}" fill="var(--sunken)"/><text x="${(x0 + W - pr) / 2}" y="${pt + 12}" text-anchor="middle" font-size="9" fill="var(--muted)">aguardando registro</text>`; }
  s += gridY(bot, top, st, y, pl, W, pr, v => String(Math.round(v)));
  range(1, N).forEach(w => s += `<text x="${x(w)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">S${w}</text>`);
  const pts = range(1, ultima).filter(w => cum[w - 1] != null).map(w => [x(w), y(cum[w - 1]), cum[w - 1], w]);
  s += `<polyline points="${pts.map(p => p[0] + "," + p[1]).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>`;
  pts.forEach(([px, py, v, w]) => s += `<circle cx="${px}" cy="${py}" r="4" fill="var(--accent)"><title>Semana ${w}: ${sinal(v)} acumulados</title></circle><text x="${px}" y="${py - 9}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--fg)">${sinal(v)}</text>`);
  return svgOpen(W, H, "Pontos acumulados por semana") + s + "</svg>";
}

/* ---------- Envio ao aluno ---------- */
const tituloEnvio = (de, ate) => `Acompanhamento · semanas ${de} a ${ate}`;
function snapshot(de, ate){
  const d = S.data, p = d.programa;
  const used = new Set(p.treinos.flatMap(t => t.itens.map(i => i.exercicio_id)));
  return {
    programa: { nome: p.nome, modalidade: p.modalidade, inicio: p.inicio, semanas: p.semanas, treinos: p.treinos },
    regs: d.regs.filter(r => r.semana >= de && r.semana <= ate).map(({ id, updated_at, ...r }) => r),
    exercicios: d.exercicios.filter(e => used.has(e.id)).map(e => ({ id: e.id, nome: e.nome })),
    obs: { ...(d.obs || {}) }, cur: semanaAtual(p), data: new Date().toLocaleDateString("pt-BR"), de, ate, prof: profDe(S.user)
  };
}
function painelEnvio(){
  const d = S.data, regs = d.regs;
  if (!regs.length) return "";
  const ultima = Math.max(...regs.map(r => r.semana));
  const rels = d.rels || [];
  const dt = r => new Date(r.created_at).toLocaleDateString("pt-BR");
  const lista = rels.length ? `<div class="list">${rels.map(r => `<div class="item"><div class="grow"><b>${esc(r.titulo)}</b><p class="small muted">Enviado em ${dt(r)}</p></div><div class="row">${d.relDel === r.id
      ? `<span class="small">Remover do app do aluno?</span><button class="btn sm danger" data-act="delRel" data-id="${r.id}">Remover</button><button class="btn sm ghost" data-act="noDelRel">Não</button>`
      : `<button class="btn sm" data-act="openRel" data-id="${r.id}">Ver</button><button class="btn sm ghost danger" data-act="askDelRel" data-id="${r.id}">Remover</button>`}</div></div>`).join("")}</div>` : `<p class="small muted">Nenhum acompanhamento enviado ainda.</p>`;
  const topo = `<div><h3>Enviar ao aluno</h3><p class="small muted">O aluno não tem acesso a esta aba. Escolha a semana inicial e a semana final, confira a prévia e envie: ele recebe uma cópia do acompanhamento desse período, com as suas observações, na tela inicial do app. A Conferência nunca vai junto.</p></div>`;
  if (ultima < 2) return `<div class="panel send">${topo}<div class="callout">Para enviar é preciso ter pelo menos duas semanas registradas: uma de partida e outra para comparar.</div>${lista}</div>`;
  const e = d.envio = d.envio || { de: 1, ate: ultima, editado: false };
  if (e.de > ultima - 1) e.de = ultima - 1;
  if (e.ate > ultima) e.ate = ultima;
  if (e.ate <= e.de) e.ate = e.de + 1;
  if (!e.editado) e.titulo = tituloEnvio(e.de, e.ate);
  const falt = regs.filter(r => r.semana >= e.de && r.semana <= e.ate && (r.carga == null) !== (r.reps == null)).length;
  const optsDe = range(1, ultima - 1).map(w => `<option value="${w}" ${w === e.de ? "selected" : ""}>Semana ${w}</option>`).join("");
  const optsAte = range(e.de + 1, ultima).map(w => `<option value="${w}" ${w === e.ate ? "selected" : ""}>Semana ${w}</option>`).join("");
  return `<div class="panel send">${topo}
    <div class="grid2">
      <label class="field"><span>1. Semana inicial (ponto de partida da comparação)</span><select id="repDe">${optsDe}</select></label>
      <label class="field"><span>2. Semana final</span><select id="repAte">${optsAte}</select></label>
    </div>

async function salvarTreino(btn){
  const { programa, regs } = S.data;
  const t = programa.treinos.find(x => x.letra === S.p.letra), sem = S.p.semana;
  const up = [], del = []; let incompletas = 0;
  for (const [i, it] of t.itens.entries()) {
    for (const s of serT(it)) {
      const c = parseN(document.getElementById(`c-${i}-${s}`)?.value), rr = parseReps(document.getElementById(`r-${i}-${s}`)?.value);
      if (Number.isNaN(c) || Number.isNaN(rr)) return toast(`Valor inválido no exercício ${i + 1}, série ${s}. Use números (repetições com pausa: 6+4).`, 4500);
      const key = { aluno_id: S.user.id, programa_id: programa.id, semana: sem, letra: t.letra, exercicio_id: it.exercicio_id, serie: s };
      if (c == null && rr == null) { if (regs.some(x => x.semana === sem && x.letra === t.letra && x.exercicio_id === it.exercicio_id && x.serie === s)) del.push(key); continue; }
      if (c == null || rr == null) incompletas++;
      up.push({ ...key, carga: c, reps: rr ? rr.reps : null, reps_txt: rr ? rr.txt : null });
    }
  }
  const obsTxt = (document.getElementById("sessObs")?.value || "").trim();
  const sessAnt = (S.data.sess || []).find(x => x.semana === sem && x.letra === t.letra);
  const mudouObs = obsTxt !== (sessAnt?.obs || "");
  if (!up.length && !del.length && !mudouObs) return toast("Preencha pelo menos uma série de trabalho.");
  btn.disabled = true;
  try {
    if (up.length || del.length) await db.saveRegistros(up, del);
    if (mudouObs) { await db.saveSessao({ aluno_id: S.user.id, programa_id: programa.id, semana: sem, letra: t.letra, obs: obsTxt }); S.data.sess = await db.getSessoes(S.user.id, programa.id); }
    S.data.regs = await db.getRegistros(S.user.id, programa.id);
    toast(incompletas ? `Treino salvo. Faltou carga ou repetições em ${incompletas} série(s).` : "Treino salvo. Bom trabalho!", 3500);
  } catch (e) { toast(traduzErro(e), 4000); }
  btn.disabled = false;
}

/* ---------- Arrastar exercícios (mouse e toque) ---------- */
let drag = null;
const NAO_ARRASTA = "input,select,textarea,a,button:not([data-drag])";
document.addEventListener("pointerdown", ev => {
  const card = ev.target.closest(".ex-edit"); if (!card || drag) return;
  if (ev.pointerType === "mouse" && ev.button !== 0) return;
  const naAlca = !!ev.target.closest("[data-drag]");
  if (!naAlca && ev.target.closest(NAO_ARRASTA)) return;
  drag = { card, list: card.parentElement, t: +card.dataset.t, pid: ev.pointerId, x0: ev.clientX, y0: ev.clientY, y: ev.clientY, active: false, tipo: ev.pointerType };
  if (ev.pointerType === "mouse" || naAlca) ev.preventDefault();
  if (naAlca) iniciarArraste();
  else if (ev.pointerType !== "mouse") drag.timer = setTimeout(() => { if (drag && !drag.active) iniciarArraste(); }, 350);
});
function iniciarArraste(){
  const d = drag, r = d.card.getBoundingClientRect();
  d.active = true; d.off = d.y - r.top;
  d.ph = document.createElement("div"); d.ph.className = "ex-ph"; d.ph.style.height = r.height + "px";
  d.list.insertBefore(d.ph, d.card);
  Object.assign(d.card.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", zIndex: 30, pointerEvents: "none", margin: 0 });
  d.card.classList.add("dragging"); document.body.classList.add("is-dragging");
  try { navigator.vibrate && navigator.vibrate(15); } catch {}
  const loop = () => {
    if (drag !== d || !d.active) return;
    if (d.y < 90) window.scrollBy(0, -12); else if (d.y > window.innerHeight - 90) window.scrollBy(0, 12);
    posicionar(d.y); requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function posicionar(y){
  const d = drag;
  d.card.style.top = (y - d.off) + "px";
  const outros = [...d.list.children].filter(c => c !== d.card && c !== d.ph);
  const antes = outros.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (antes) { if (d.ph.nextElementSibling !== antes) d.list.insertBefore(d.ph, antes); }
  else if (d.list.lastElementChild !== d.ph) d.list.appendChild(d.ph);
}
document.addEventListener("pointermove", ev => {
  const d = drag; if (!d || ev.pointerId !== d.pid) return;
  d.y = ev.clientY;
  if (!d.active) {
    const mov = Math.hypot(ev.clientX - d.x0, ev.clientY - d.y0);
    if (d.tipo === "mouse") { if (mov > 5) iniciarArraste(); else return; }
    else { if (mov > 10) { clearTimeout(d.timer); drag = null; } return; }
  }
  ev.preventDefault();
  posicionar(ev.clientY);
}, { passive: false });
document.addEventListener("touchmove", ev => { if (drag && drag.active) ev.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", ev => { if (drag) ev.preventDefault(); });
function endDrag(ev){
  const d = drag; if (!d || ev.pointerId !== d.pid) return;
  clearTimeout(d.timer); drag = null;
  if (!d.active) return;
  const resto = [...d.list.children].filter(c => c !== d.card);
  const to = resto.indexOf(d.ph), from = +d.card.dataset.idx;
  const arr = S.data.draft.treinos[d.t].itens;
  if (to >= 0 && to !== from) { const [m] = arr.splice(from, 1); arr.splice(to, 0, m); S.data.dirty = true; }
  document.body.classList.remove("is-dragging");
  const y = window.scrollY; render(); window.scrollTo(0, y);
  if (to >= 0 && to !== from) toast(`Exercício movido para a posição ${to + 1}`);
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);
document.addEventListener("keydown", ev => {
  const h = ev.target.closest?.("[data-drag]"); if (!h || !["ArrowUp", "ArrowDown"].includes(ev.key)) return;
  ev.preventDefault();
  const t = +h.dataset.t, i = +h.dataset.i, j = i + (ev.key === "ArrowUp" ? -1 : 1), arr = S.data.draft.treinos[t].itens;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; S.data.dirty = true; render();
  document.querySelector(`[data-drag][data-i="${j}"]`)?.focus();
});

   INÍCIO
   ===================================================================== */
const contaPendencias = l => l.filter(u => statusDe(u) === "pendente" || (statusDe(u) === "ativo" && (u.cref_conferido === false || (diasPara(u.cref_validade) ?? -1) < 0))).length;
async function entrar(){
  PROF = null; S.pendentes = 0;
  try {
    if (S.user.role === "aluno" && S.user.personal_id) PROF = await db.getPerfil(S.user.personal_id);
    else if (isPers()) PROF = S.user;
    if (isMaster()) S.pendentes = contaPendencias(await db.listPersonais());
  } catch {}
  go(rotaInicial());
}
async function start(){
  if (DEMO) { db = makeDemo(); render(); return; }
  $app.innerHTML = `<main><div class="wrap"><p class="muted">Carregando…</p></div></main>`;
  try {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"; s.onload = res; s.onerror = () => rej(new Error("Failed to fetch")); document.head.appendChild(s); });
    db = makeSupabase();
    S.user = await db.current();
  } catch (e) { $app.innerHTML = `<main><div class="wrap"><div class="callout">${esc(traduzErro(e))}</div></div></main>`; return; }
  if (S.user) entrar(); else render();
}
start();
