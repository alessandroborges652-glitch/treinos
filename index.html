<style>
/* Layout: faixa de marca no topo, coluna única de até 880px; cartões só onde há um objeto (exercício, aluno). */
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --sunken:#ECE8E1; --fg:#22282A; --muted:#66757A; --line:#DCD7CE;
  --accent:#0E4C55; --accent-2:#1B8A93; --accent-soft:#DDEEEF; --on-accent:#F4F1EC;
  --band:#0E4C55; --on-band:#F4F1EC; --band-muted:#9FC9CD;
  --up:#1B7A4B; --up-soft:#DCEFE3; --down:#A8452A; --down-soft:#F5E1DC; --warn:#946010; --warn-soft:#F6EAD3;
  --prev:#00939F; --cur:#C25E22; --mk1:#0E4C55; --mk4:#1B8A93;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1719; --surface:#152225; --sunken:#0B1315; --fg:#E8ECEA; --muted:#93A4A7; --line:#26383C;
  --accent:#5CC9D2; --accent-2:#5CC9D2; --accent-soft:#163A3F; --on-accent:#0B1315;
  --band:#0A3A41; --on-band:#F4F1EC; --band-muted:#8BBFC4;
  --up:#5BC48C; --up-soft:#173527; --down:#E08A6B; --down-soft:#3A1F1A; --warn:#E5B661; --warn-soft:#3A2D14;
  --prev:#2AA3AE; --cur:#D4783A; --mk1:#F4F1EC; --mk4:#5CC9D2;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1719; --surface:#152225; --sunken:#0B1315; --fg:#E8ECEA; --muted:#93A4A7; --line:#26383C;
  --accent:#5CC9D2; --accent-2:#5CC9D2; --accent-soft:#163A3F; --on-accent:#0B1315;
  --band:#0A3A41; --on-band:#F4F1EC; --band-muted:#8BBFC4;
  --up:#5BC48C; --up-soft:#173527; --down:#E08A6B; --down-soft:#3A1F1A; --warn:#E5B661; --warn-soft:#3A2D14;
  --prev:#2AA3AE; --cur:#D4783A; --mk1:#F4F1EC; --mk4:#5CC9D2;
  color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:var(--on-band)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:.72rem;color:var(--band-muted);letter-spacing:.02em}
.brand svg{flex:none}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--band-muted);font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
.nav button[aria-current="page"]{color:var(--on-band);background:rgba(255,255,255,.12)}
.nav button:hover{color:var(--on-band)}
.demo{background:var(--warn-soft);color:var(--warn);font-size:.85rem;font-weight:600}
.demo .wrap{padding-block:8px}

main .wrap{padding-block:24px 96px;display:flex;flex-direction:column;gap:20px}

/* Controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r);font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg);min-height:40px}
.btn:hover{border-color:var(--accent-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--down)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.spacer{flex:1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item .grow{flex:1;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--up-soft);color:var(--up)}
.chip.bad{background:var(--down-soft);color:var(--down)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.letters{display:flex;gap:6px;flex-wrap:wrap}
.letters button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:1.05rem;cursor:pointer;position:relative}
.letters button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.letters button .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent-2)}

/* Editor de programa */
.ex-edit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.ex-edit .head{display:flex;gap:8px;align-items:center}
.ex-edit .ord{font-weight:800;color:var(--accent-2);width:22px;flex:none}
.ex-edit .presc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.ex-edit .presc{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Treino do aluno */
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex-card header{padding:14px 16px 10px;display:flex;gap:12px;align-items:flex-start}
.ex-card .n{font-weight:800;color:var(--accent-2);font-size:1.1rem;line-height:1.3;width:24px;flex:none}
.ex-card .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.presc-line{display:flex;gap:6px;flex-wrap:wrap}
.obs{font-size:.9rem;background:var(--sunken);border-radius:8px;padding:8px 10px}
.video{border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%}
.video iframe{width:100%;height:100%;border:0;display:block}
.video-ph{aspect-ratio:16/9;max-width:100%;border-radius:10px;background:repeating-linear-gradient(-22deg,var(--accent-soft) 0 14px,var(--sunken) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;color:var(--accent);font-weight:700}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;font-weight:700}
.sets td{padding:4px 6px;vertical-align:middle}
.sets td:first-child{font-weight:800;width:44px;color:var(--muted)}
.sets input{min-height:44px;text-align:center;font-weight:700;font-size:1rem}
.sets .prev{font-size:.8rem;color:var(--muted);white-space:nowrap}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}

/* Evolução */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.data{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.data th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--sunken)}
table.data tr:last-child td{border-bottom:0}
table.data td.c{text-align:center}
.freq td.c{font-weight:800}
.chart svg{width:100%;height:auto;display:block}
.callout{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:.9rem;font-weight:600}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Login */
.login{max-width:420px;margin:0 auto;width:100%}
.hero-mark{display:flex;align-items:center;gap:12px}

/* Arrastar exercícios */
.ex-list{display:flex;flex-direction:column;gap:10px}
.drag{flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border:1px dashed var(--line);background:var(--surface);color:var(--muted);font-size:1.15rem;line-height:1;width:36px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.drag:hover{color:var(--accent);border-color:var(--accent-2)}
.ex-edit.dragging{box-shadow:0 12px 32px rgba(0,0,0,.2);border-color:var(--accent-2);background:var(--surface);position:relative;z-index:3}
.ex-edit.dragging .drag{cursor:grabbing;color:var(--accent)}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
/* Acompanhamento */
h4{margin:0;font-size:.95rem;font-weight:700}
.rep-head{gap:12px}
.selo{align-self:flex-start;font-size:.7rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;border:1.5px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sec-n{font-size:.7rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-2);margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.tile b{font-size:1.2rem;font-weight:800}
.tile.cur{border-color:var(--cur)} .tile.prev{border-color:var(--prev)}
.tdets{display:flex;flex-direction:column}
.tdet{display:flex;flex-direction:column;gap:14px;padding-block:16px;border-top:1px solid var(--line)}
.tdets>.tdet:first-child{border-top:0;padding-top:0}
.exd{display:flex;flex-direction:column;gap:8px}
.ex-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
@media (max-width:680px){.ex-detail{grid-template-columns:minmax(0,1fr)}}
.multiples{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mult{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sub{display:block;font-size:.75rem;color:var(--muted);font-weight:500}
.tot,.saldo{font-variant-numeric:tabular-nums}
.saldo{font-size:1.05rem}
.rep-foot{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:480px){table.data th,table.data td{padding:7px 7px}}
.fix{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.fix input{width:96px;min-height:34px}
.chart{min-width:0}
.ex-edit{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ex-edit input,.ex-edit textarea{-webkit-user-select:text;user-select:text}
.ex-ph{border:2px dashed var(--accent-2);border-radius:12px;background:var(--accent-soft)}
select.pos{width:66px;flex:none;font-weight:800;color:var(--accent-2);padding:6px 4px}
.tabs.sub{border-bottom:0;gap:6px;flex-wrap:wrap;overflow:visible}
.tabs.sub button{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem;background:var(--surface)}
.tabs.sub button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.obsf textarea{min-height:80px;background:var(--bg)}
.obsf{border-top:1px solid var(--line);padding-top:12px}
.obs-pt{border-left:3px solid var(--accent-2);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.obs-pt .label{color:var(--accent)}
.send{border-color:var(--accent-2)}
/* Sistema de cores das séries */
.t-aquecimento{--tc:#DCEAEC;--tt:#0E4C55}
.t-reconhecimento{--tc:#8FC6CC;--tt:#0B3A41}
.t-trabalho{--tc:#0E4C55;--tt:#F4F1EC}
.t-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--tc);color:var(--tt);white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(127,160,165,.35)}
.sets-list{display:flex;flex-direction:column;gap:6px}
.set{border:1px solid var(--line);border-left:7px solid var(--tc);background:var(--bg);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.set-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-head .meta{font-weight:700;font-variant-numeric:tabular-nums}
.set-head .desc{margin-left:auto;font-size:.8rem;color:var(--muted)}
.set-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.set-in input{width:84px;min-height:44px;text-align:center;font-weight:700;font-size:1rem}
.set-in .x{color:var(--muted);font-weight:700;font-size:.85rem}
.set .prev{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.set .skip{font-size:.82rem;color:var(--muted)}
details.legend-card>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;font-weight:700}
details.legend-card>summary::-webkit-details-marker{display:none}
details.legend-card>summary::after{content:"▾";margin-left:auto;color:var(--muted)}
details.legend-card:not([open])>summary::after{content:"▸"}
.legend-t{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.lt{border:1px solid var(--line);border-left:7px solid var(--tc);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.sets-edit{display:flex;flex-direction:column;gap:6px}
.set-row{display:grid;grid-template-columns:22px minmax(130px,1.3fr) minmax(0,1fr) minmax(0,.8fr) 36px;gap:6px;align-items:center}
.set-row .n{font-weight:800;color:var(--muted);text-align:center}
select.tipo-sel{background:var(--tc);color:var(--tt);font-weight:800;border-color:transparent}
@media (max-width:520px){.set-row{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr)}.set-row .rir-in{grid-column:2}.set-row .rm{grid-column:3;justify-self:end}}
.add-sets{display:flex;gap:6px;flex-wrap:wrap}
.add-sets .btn{border-left:7px solid var(--tc)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.info-grid div{display:flex;flex-direction:column;gap:2px}
.ori{display:flex;flex-direction:column;gap:2px;padding-block:8px;border-top:1px solid var(--line)}
.ori:first-of-type{border-top:0}
.sess-note{border-left:3px solid var(--warn);padding:4px 10px;font-size:.9rem}
.tipo-cad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tipo-cad button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.tipo-cad button span{font-weight:500;font-size:.78rem;color:var(--muted)}
.tipo-cad button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cref-ph{aspect-ratio:3/2;max-width:320px;border-radius:10px;background:repeating-linear-gradient(-22deg,var(--accent-soft) 0 12px,var(--sunken) 12px 24px);display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:700;text-align:center;padding:12px}
.cref-img{max-width:min(420px,100%);border-radius:10px;border:1px solid var(--line)}
.badge{display:inline-flex;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#E5B661;color:#22282A;font-size:.7rem;font-weight:800;align-items:center;justify-content:center;margin-left:4px}
.zona-risco{border-color:var(--down)}
.zona-risco h3{color:var(--down)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:.4}}}
</style>
<!--HEAD-END-->
</head>

function makeSupabase(){
  const c = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  return {
    async current(){
      const { data: { session } } = await c.auth.getSession();
      if (!session) return null;
      return ok(await c.from("profiles").select("*").eq("id", session.user.id).single());
    },
    async signIn(email, password){ ok(await c.auth.signInWithPassword({ email, password })); return this.current(); },
    async signUp(nome, email, password, extra = {}){
      const d = ok(await c.auth.signUp({ email, password, options: { data: { nome, ...extra }, emailRedirectTo: location.origin + location.pathname } }));
      return d.session ? this.current() : null;
    },
    async getPerfil(id){ return ok(await c.from("profiles").select("id,nome,cref,role,email").eq("id", id).maybeSingle()); },
    async listPersonais(){ return ok(await c.from("profiles").select("*").eq("role", "personal").order("created_at", { ascending: false })); },
    async aprovarPersonal(id, aprovar){ ok(await c.rpc("aprovar_personal", { uid: id, aprovar })); },
    async enviarCref(uid, file, campos = {}){
      const upd = { ...campos };
      if (file) {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const path = `${uid}/cref-${Date.now()}.${ext}`;
        ok(await c.storage.from("cref").upload(path, file, { upsert: true, contentType: file.type || undefined }));
        upd.cref_foto = path;
      }
      if (Object.keys(upd).length) ok(await c.from("profiles").update(upd).eq("id", uid));
    },
    async excluirConta(uid){
      try { const { data } = await c.storage.from("cref").list(uid); if (data?.length) await c.storage.from("cref").remove(data.map(f => `${uid}/${f.name}`)); } catch {}
      ok(await c.rpc("excluir_conta", { uid }));
    },
    async crefUrl(path){ const d = ok(await c.storage.from("cref").createSignedUrl(path, 600)); return d.signedUrl; },
    async signOut(){ await c.auth.signOut(); },
    async listAlunos(){ return ok(await c.from("profiles").select("*").eq("role", "aluno").eq("personal_id", S.user.id).order("nome")); },
    async listProgramas(){ return ok(await c.from("programas").select("id,aluno_id,nome,inicio,semanas,updated_at").eq("ativo", true)); },
    async listExercicios(){ return ok(await c.from("exercicios").select("*").order("nome")); },
    async saveExercicio(ex){
      const row = { nome: ex.nome, grupo: ex.grupo, video_url: ex.video_url, descricao: ex.descricao };
      return ex.id ? ok(await c.from("exercicios").update(row).eq("id", ex.id).select().single())
                   : ok(await c.from("exercicios").insert(row).select().single());
    },
    async deleteExercicio(id){ ok(await c.from("exercicios").delete().eq("id", id)); },
    async getPrograma(alunoId){
      return ok(await c.from("programas").select("*").eq("aluno_id", alunoId).eq("ativo", true).order("updated_at", { ascending: false }).limit(1).maybeSingle());
    },
    async savePrograma(p){
      const row = { aluno_id: p.aluno_id, nome: p.nome, modalidade: p.modalidade, objetivo: p.objetivo || null, reavaliacao: p.reavaliacao || null, frequencia: p.frequencia ? Number(p.frequencia) : null, restricoes: p.restricoes || null, inicio: p.inicio, semanas: p.semanas, treinos: p.treinos, ativo: true, updated_at: new Date().toISOString() };
      return p.id ? ok(await c.from("programas").update(row).eq("id", p.id).select().single())
                  : ok(await c.from("programas").insert(row).select().single());
    },
    async getSessoes(alunoId, pid){ return ok(await c.from("sessoes").select("*").eq("aluno_id", alunoId).eq("programa_id", pid)); },
    async saveSessao(r){ ok(await c.from("sessoes").upsert({ ...r, updated_at: new Date().toISOString() }, { onConflict: "aluno_id,programa_id,semana,letra" })); },
    async getObs(pid){ const d = ok(await c.from("anotacoes").select("obs").eq("programa_id", pid).maybeSingle()); return d?.obs || {}; },
    async saveObs(pid, obs){ ok(await c.from("anotacoes").upsert({ programa_id: pid, obs, updated_at: new Date().toISOString() }, { onConflict: "programa_id" })); },
    async listRelatorios(alunoId){ return ok(await c.from("relatorios").select("id,titulo,created_at").eq("aluno_id", alunoId).order("created_at", { ascending: false })); },
    async getRelatorio(id){ return ok(await c.from("relatorios").select("*").eq("id", id).single()); },
    async saveRelatorio(r){ return ok(await c.from("relatorios").insert(r).select("id").single()); },
    async deleteRelatorio(id){ ok(await c.from("relatorios").delete().eq("id", id)); },
    async getRegistros(alunoId, programaId){
      return ok(await c.from("registros").select("*").eq("aluno_id", alunoId).eq("programa_id", programaId));
    },
    async saveRegistros(up, del){
      if (up.length) ok(await c.from("registros").upsert(up.map(({ id, ...r }) => ({ ...r, updated_at: new Date().toISOString() })), { onConflict: "aluno_id,programa_id,semana,letra,exercicio_id,serie" }));
      for (const k of del) ok(await c.from("registros").delete().match(k));
    }
  };
}

  const rels = [{ id: 50, aluno_id: "a1", programa_id: 1, titulo: "Acompanhamento · semanas 1 a 2", created_at: new Date(Date.now() - 8 * 86400000).toISOString(),
    dados: { programa: clone(progs[0]), regs: snap, exercicios: exs.map(e => ({ id: e.id, nome: e.nome })), cur: 3, de: 1, ate: 2, data: new Date(Date.now() - 8 * 86400000).toLocaleDateString("pt-BR"),
      obs: { panorama: "Duas semanas completas, todos os treinos feitos (exemplo).", fechamento: "Bom início de bloco. Seguimos com a mesma estrutura (exemplo)." } } }];
  const keyOf = r => [r.aluno_id, r.programa_id, r.semana, r.letra, r.exercicio_id, r.serie].join("|");
  return {
    demo: true, users,
    async current(){ return me; },
    async demoLogin(id){ me = users.find(u => u.id === id); return me; },
    async signOut(){ me = null; },
    async listAlunos(){ return clone(users.filter(u => u.role === "aluno" && u.personal_id === me.id)); },
    async getPerfil(id){ const u = users.find(x => x.id === id); return u ? clone(u) : null; },
    async listPersonais(){ return clone(users.filter(u => u.role === "personal")); },
    async aprovarPersonal(id, aprovar){ const u = users.find(x => x.id === id); if (u) { u.status = aprovar ? "ativo" : "recusado"; u.cref_conferido = aprovar; } },
    async enviarCref(uid, file, campos = {}){ const u = users.find(x => x.id === uid); if (u) { if (file) u.cref_foto = "demo"; Object.assign(u, campos); if (u.role !== "master") u.cref_conferido = false; } },
    async excluirConta(uid){
      const u = users.find(x => x.id === uid);
      if (!u) return; if (u.role === "master") throw new Error("O login mestre não pode ser excluído pelo app");
      users.forEach(x => { if (x.personal_id === uid) x.personal_id = "p1"; });
      users.splice(users.indexOf(u), 1); if (me?.id === uid) me = null;
    },
    async crefUrl(){ return null; },
    async listProgramas(){ return clone(progs); },
    async listExercicios(){ return clone(exs).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR")); },
    async saveExercicio(ex){
      if (ex.id) { Object.assign(exs.find(e => e.id === ex.id), ex); return clone(ex); }
      const n = { ...ex, id: nextId++ }; exs.push(n); return clone(n);
    },
    async deleteExercicio(id){ const i = exs.findIndex(e => e.id === id); if (i >= 0) exs.splice(i, 1); },
    async getPrograma(alunoId){ const p = progs.find(p => p.aluno_id === alunoId); return p ? clone(p) : null; },
    async savePrograma(p){
      if (p.id) { const i = progs.findIndex(x => x.id === p.id); progs[i] = clone(p); return clone(p); }
      const n = { ...clone(p), id: nextId++ }; progs.push(n); return clone(n);
    },
    async getObs(pid){ return clone(obsMap[pid] || {}); },
    async getSessoes(a, pid){ return clone(sess.filter(x => x.aluno_id === a && x.programa_id === pid)); },
    async saveSessao(r){ const i = sess.findIndex(x => x.aluno_id === r.aluno_id && x.programa_id === r.programa_id && x.semana === r.semana && x.letra === r.letra); if (i >= 0) sess[i] = { ...r, updated_at: new Date().toISOString() }; else sess.push({ ...r, updated_at: new Date().toISOString() }); },
    async saveObs(pid, o){ obsMap[pid] = clone(o); },
    async listRelatorios(a){ return clone(rels.filter(r => r.aluno_id === a).map(({ dados, ...r }) => r)).reverse(); },
    async getRelatorio(id){ return clone(rels.find(r => r.id === id)); },
    async saveRelatorio(r){ const n = { ...clone(r), id: nextId++, created_at: new Date().toISOString() }; rels.push(n); return { id: n.id }; },
    async deleteRelatorio(id){ const i = rels.findIndex(r => r.id === id); if (i >= 0) rels.splice(i, 1); },
    async getRegistros(alunoId, programaId){ return clone(regs.filter(r => r.aluno_id === alunoId && r.programa_id === programaId)); },
    async saveRegistros(up, del){
      for (const r of up) { const k = keyOf(r); const i = regs.findIndex(x => keyOf(x) === k); if (i >= 0) regs[i] = { ...r }; else regs.push({ ...r }); }
      for (const d of del) { const k = keyOf(d); const i = regs.findIndex(x => keyOf(x) === k); if (i >= 0) regs.splice(i, 1); }
    }
  };
}

let db;
const S = { user: null, view: "login", p: {}, data: {}, busy: false };
const $app = document.getElementById("app");

function toast(msg, ms = 2600){
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}

async function go(view, p = {}){
  S.view = view; S.p = p; S.data = {};
  render(true);
  try {
    if (view === "alunos") {
      const [alunos, progs] = await Promise.all([db.listAlunos(), db.listProgramas()]);
      S.data = { alunos, progs };
    } else if (view === "aluno") {
      const [alunos, prog, exercicios] = await Promise.all([db.listAlunos(), db.getPrograma(p.alunoId), db.listExercicios()]);
      const aluno = alunos.find(a => a.id === p.alunoId) || (p.alunoId === S.user.id ? S.user : null);
      const programa = prog ? normPrograma(prog) : null;
      const regs = programa?.id ? await db.getRegistros(p.alunoId, programa.id) : [];
      const [obs, rels, sess] = programa?.id ? await Promise.all([db.getObs(programa.id), db.listRelatorios(p.alunoId), db.getSessoes(p.alunoId, programa.id)]) : [{}, [], []];
      S.data = { aluno, programa, regs, exercicios, obs, rels, sess, envio: p.envio || null,
        draft: programa ? clone(programa) : { aluno_id: p.alunoId, nome: "Programa 1", modalidade: "feedback semanal", inicio: todayISO(), semanas: 8, treinos: LETRAS.map(l => ({ letra: l, nome: "", itens: [] })) },
        dirty: false };
      S.p.tab = p.tab || "programa"; S.p.letra = p.letra || "A";
    } else if (view === "orientacoes") {
      const prog = S.user.role === "aluno" ? await db.getPrograma(S.user.id) : null;
      S.data = { programa: prog ? normPrograma(prog) : null };
    } else if (view === "relatorio") {
      S.data = { rel: p.snapshot || await db.getRelatorio(p.id) };
    } else if (view === "personais") {
      S.data = { lista: await db.listPersonais(), fotos: {} };
    } else if (view === "pendente" || view === "conta") {
      S.data = { confirmarExclusao: false };
    } else if (view === "biblioteca") {
      S.data = { exercicios: await db.listExercicios(), q: "", edit: null, confirm: null };
    } else if (view === "home" || view === "treino") {
      const [prog, exercicios] = await Promise.all([db.getPrograma(S.user.id), db.listExercicios()]);
      const programa = prog ? normPrograma(prog) : null;
      const regs = programa ? await db.getRegistros(S.user.id, programa.id) : [];
      const obs = programa && isPers() ? await db.getObs(programa.id) : {};
      const rels = S.user.role === "aluno" ? await db.listRelatorios(S.user.id) : [];
      const sess = programa ? await db.getSessoes(S.user.id, programa.id) : [];
      S.data = { programa, regs, exercicios, obs, rels, sess };
      if (programa) { S.p.semana = p.semana || semanaAtual(programa); }
    }
  } catch (e) { S.data.error = traduzErro(e); }
  render();
  if (!p.keepScroll) window.scrollTo(0, 0);
}

function editorPrograma(){
  const d = S.data.draft, exs = S.data.exercicios;

  const opts = sel => exs.map(e => `<option value="${e.id}" ${e.id === sel ? "selected" : ""}>${esc(e.nome)}${e.grupo ? " · " + esc(e.grupo) : ""}</option>`).join("");
  const used = new Set(t.itens.map(i => i.exercicio_id));
  const items = t.itens.map((it, ii) => {
    const sets = it.sets.map((st, k) => `<div class="set-row t-${st.tipo}">
        <span class="n num">${k + 1}</span>
        <select class="tipo-sel" data-sf="tipo" data-t="${ti}" data-i="${ii}" data-k="${k}" aria-label="Tipo da série ${k + 1}">${ORDEM_TIPOS.map(o => `<option value="${o}" ${o === st.tipo ? "selected" : ""}>${TIPOS[o].nome}</option>`).join("")}</select>
        <input type="text" data-sf="reps" data-t="${ti}" data-i="${ii}" data-k="${k}" value="${esc(st.reps)}" placeholder="reps (ex.: 6-8)" aria-label="Repetições da série ${k + 1}">
        <input class="rir-in" type="text" data-sf="rir" data-t="${ti}" data-i="${ii}" data-k="${k}" value="${esc(st.rir)}" placeholder="RIR" aria-label="RIR da série ${k + 1}">
        <button type="button" class="btn sm danger rm" data-act="rmSet" data-t="${ti}" data-i="${ii}" data-k="${k}" aria-label="Remover série ${k + 1}" ${it.sets.length === 1 ? "disabled" : ""}>✕</button></div>`).join("");
    return `<div class="ex-edit" data-idx="${ii}" data-t="${ti}">
      <div class="head"><button type="button" class="drag" data-drag data-t="${ti}" data-i="${ii}" aria-label="Arrastar para mudar a ordem (ou use as setas do teclado)" title="Arraste para mudar a ordem">⠿</button><select class="pos num" data-pos data-t="${ti}" data-i="${ii}" aria-label="Posição do exercício" title="Posição">${t.itens.map((_, k) => `<option value="${k}" ${k === ii ? "selected" : ""}>${k + 1}º</option>`).join("")}</select>
        <select data-f="exercicio_id" data-t="${ti}" data-i="${ii}" aria-label="Exercício" style="flex:1;min-width:0">${exMap[it.exercicio_id] ? "" : '<option value="">(exercício removido)</option>'}${opts(it.exercicio_id)}</select>
        <button class="btn sm danger" data-act="rmItem" data-t="${ti}" data-i="${ii}" aria-label="Remover exercício">✕</button></div>
      <div class="sets-edit"><span class="label">Séries · tipo, repetições e RIR</span>${sets}
        <div class="add-sets">${it.sets.length < 8 ? ORDEM_TIPOS.map(o => `<button type="button" class="btn sm t-${o}" data-act="addSet" data-tipo="${o}" data-t="${ti}" data-i="${ii}">+ ${TIPOS[o].nome}</button>`).join("") : `<span class="small muted">Máximo de 8 séries.</span>`}</div></div>
      <div class="grid2">
        <label class="field"><span>Descanso (só se diferente da cor)</span><input type="text" data-f="descanso" data-t="${ti}" data-i="${ii}" value="${esc(it.descanso)}" placeholder="padrão: 60 / 90 / 120 s"></label>
        <label class="field"><span>Observação de execução</span><input type="text" data-f="obs" data-t="${ti}" data-i="${ii}" value="${esc(it.obs)}" placeholder="Ex.: 1 drop na última série"></label>
      </div>
    </div>`;
  }).join("");
  const free = exs.filter(e => !used.has(e.id));
  return `<div class="panel">
      <div class="grid2">
        <label class="field"><span>Nome do programa</span><input type="text" data-f="nome" value="${esc(d.nome)}"></label>
        <label class="field"><span>Objetivo</span><input type="text" data-f="objetivo" value="${esc(d.objetivo)}" placeholder="Ex.: Hipertrofia"></label>

/* ---------- Aluno: início ---------- */
function viewHome(){
  const { programa, regs } = S.data;
  if (!programa) return `<div><h1>Olá, ${esc(S.user.nome.split(" ")[0])}</h1></div><div class="empty">${isPers() ? "Você ainda não montou o seu próprio programa. Vá em Alunos → Meu treino → Editar programa." : "Seu programa de treino ainda não foi liberado. Assim que estiver pronto, ele aparece aqui."}</div>${isPers() ? "" : listaRelatorios()}`;
  const sem = S.p.semana, cur = semanaAtual(programa);
  const treinos = programa.treinos.filter(t => t.itens.length);
  const cards = treinos.map(t => {
    const done = regs.filter(r => r.semana === sem && r.letra === t.letra);
    const total = t.itens.reduce((s, i) => s + serT(i).length, 0);
    const st = done.length ? (done.length >= total ? `<span class="chip ok">Registrado</span>` : `<span class="chip warn num">${done.length}/${total} séries</span>`) : `<span class="chip">A fazer</span>`;
    return `<div class="item"><div class="letters"><button tabindex="-1" aria-hidden="true" aria-selected="true">${t.letra}</button></div><div class="grow"><h3>${esc(t.nome || "Treino " + t.letra)}</h3><p class="small muted num">${t.itens.length} exercícios</p></div>${st}<button class="btn primary" data-act="openTreino" data-l="${t.letra}">Abrir</button></div>`;
  }).join("");
  const semOpts = Array.from({ length: programa.semanas }, (_, i) => i + 1).map(w => `<option value="${w}" ${w === sem ? "selected" : ""} ${w > cur ? "disabled" : ""}>Semana ${w}${w === cur ? " (atual)" : ""}</option>`).join("");
  return `<div><p class="label">${esc(programa.nome)}</p><h1>Olá, ${esc(S.user.nome.split(" ")[0])}</h1></div>
    <div class="panel"><div class="info-grid">
      ${programa.objetivo ? `<div><span class="label">Objetivo</span><b>${esc(programa.objetivo)}</b></div>` : ""}
      <div><span class="label">Início do bloco</span><b class="num">${fmtData(programa.inicio)}</b></div>
      ${programa.reavaliacao ? `<div><span class="label">Reavaliação</span><b class="num">${fmtData(programa.reavaliacao)}</b></div>` : ""}
      ${programa.frequencia ? `<div><span class="label">Frequência</span><b class="num">${esc(programa.frequencia)}x por semana</b></div>` : ""}
      ${programa.restricoes ? `<div><span class="label">Restrições</span><b>${esc(programa.restricoes)}</b></div>` : ""}
    </div><div class="row"><button class="btn" data-act="nav" data-v="orientacoes">Orientações do treino</button><span class="small muted">Sistema de cores, RIR, como progredir e segurança.</span></div></div>
    <div class="row"><label class="field" style="min-width:200px"><span>Semana do programa</span><select id="semSel">${semOpts}</select></label><span class="small muted num" style="align-self:flex-end;padding-bottom:10px">de ${programa.semanas} semanas</span></div>
    <div class="list">${cards}</div>
    ${isPers() ? `<h2 style="margin-top:12px">Registro do meu treino</h2>${evolucao({ prog: programa, regs, exercicios: S.data.exercicios, modo: "proprio", obs: S.data.obs, sess: S.data.sess, editavel: true, prof: profDe(S.user) })}` : listaRelatorios()}`;
}

/* ---------- Aluno: treino ---------- */
function viewTreino(){
  const { programa, regs, exercicios } = S.data;
  if (!programa) return `<div class="empty">Programa não encontrado.</div>`;
  const t = programa.treinos.find(x => x.letra === S.p.letra);
  const sem = S.p.semana;
  const exMap = Object.fromEntries(exercicios.map(e => [e.id, e]));
  const find = (w, id, s) => regs.find(r => r.semana === w && r.letra === t.letra && r.exercicio_id === id && r.serie === s);
  const sessao = (S.data.sess || []).find(x => x.semana === sem && x.letra === t.letra);
  const cards = t.itens.map((it, i) => {
    const e = exMap[it.exercicio_id] || { nome: "Exercício", grupo: "" };
    const open = S.p.video === i;
    let video = "";
    if (open) {
      const id = ytId(e.video_url);
      video = (DEMO || e.video_url === "demo")
        ? `<div class="video-ph">${MARK(36)}<span>Seu vídeo explicando o exercício aparece aqui</span><span class="small muted">No app publicado, o vídeo do YouTube toca nesta área.</span></div>`
        : id ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0&modestbranding=1&playsinline=1" title="${esc(e.nome)}" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div><a class="small" href="https://youtu.be/${id}" target="_blank" rel="noopener">Abrir no YouTube</a>`
        : `<div class="obs">Vídeo ainda não cadastrado para este exercício.</div>`;
    }
    const cont = Object.fromEntries(ORDEM_TIPOS.map(k => [k, it.sets.filter(x => x.tipo === k).length]));
    let ordT = 0;
    const sets = it.sets.map((st, k) => {
      const tp = TIPOS[st.tipo];
      const meta = [st.reps && `${st.reps}${/^\d+(\s*(-|–|a)\s*\d+)?$/.test(st.reps.trim()) ? " reps" : ""}`, st.rir && `RIR ${st.rir}`].filter(Boolean).join(" · ");
      const desc = st.tipo === "trabalho" && it.descanso ? it.descanso : tp.descanso;
      const head = `<div class="set-head"><span class="t-pill">${k + 1}ª · ${tp.nome}${st.tipo === "trabalho" ? ` ${ordT + 1}` : ""}</span><span class="meta">${esc(meta)}</span><span class="desc">descanso ${esc(desc)}</span></div>`;
      if (st.tipo !== "trabalho") return `<div class="set t-${st.tipo}">${head}<span class="skip">${tp.curto} (${tp.carga}). Não precisa registrar.</span></div>`;
      const s = ++ordT;
      const r = find(sem, it.exercicio_id, s), pv = find(sem - 1, it.exercicio_id, s);
      return `<div class="set t-trabalho">${head}<div class="set-in">
        <input id="c-${i}-${s}" type="text" inputmode="decimal" value="${esc(fmt(r?.carga))}" placeholder="${pv?.carga != null ? esc(fmt(pv.carga)) : "kg"}" aria-label="Carga em kg, série de trabalho ${s}"><span class="x">kg ×</span>
        <input id="r-${i}-${s}" type="text" inputmode="tel" value="${esc(r?.reps_txt ?? r?.reps ?? "")}" placeholder="${pv?.reps != null ? esc(pv.reps_txt ?? pv.reps) : "reps"}" aria-label="Repetições, série de trabalho ${s}"><span class="x">reps</span>
        ${pv && (pv.carga != null || pv.reps != null) ? `<span class="prev">Sem. ${sem - 1}: ${esc(fmt(pv.carga) || "–")} kg × ${esc(pv.reps_txt ?? pv.reps ?? "–")}</span>` : ""}</div></div>`;
    }).join("");
    return `<article class="ex-card"><header><span class="n num">${i + 1}</span><div style="flex:1;min-width:0"><h3>${esc(e.nome)}</h3><div class="presc-line" style="margin-top:6px">
        ${ORDEM_TIPOS.filter(k => cont[k]).map(k => `<span class="t-pill t-${k}">${cont[k]} ${TIPOS[k].nome.toLowerCase()}</span>`).join("")}${it.descanso ? `<span class="chip warn num">Descanso diferente: ${esc(it.descanso)}</span>` : ""}</div></div></header>
      <div class="body">
        ${it.obs || e.descricao ? `<div class="obs">${esc([it.obs, e.descricao].filter(Boolean).join(" · "))}</div>` : ""}
        <div><button class="btn sm" data-act="video" data-i="${i}" aria-expanded="${open}">${open ? "Fechar vídeo" : "▶ Ver vídeo do exercício"}</button></div>
        ${video}
        <div class="sets-list">${sets}</div>
      </div></article>`;
  }).join("");
  return `<div><button class="btn ghost sm" data-act="nav" data-v="home">← Meus treinos</button></div>
    <div><p class="label num">Treino ${t.letra} · Semana ${sem} de ${programa.semanas}</p><h1>${esc(t.nome || "Treino " + t.letra)}</h1>
    <p class="small muted" style="margin-top:4px">Siga a ordem dos exercícios. Registre carga e repetições só nas séries de trabalho; o número claro em cada campo é o da semana anterior. Série com pausa no meio? Anote assim: 6+4.</p></div>
    <details class="panel legend-card" ${S.p.legenda === false ? "" : "open"}><summary>Como ler as séries · sistema de cores</summary>${legendaTipos(false)}
      <div class="row"><button class="btn sm" data-act="nav" data-v="orientacoes">Orientações completas</button><span class="small muted">5 a 8 min de aquecimento geral antes do primeiro exercício.</span></div></details>
    <div id="treinoCards" style="display:flex;flex-direction:column;gap:20px">${cards}</div>
    <div class="panel"><label class="field"><span>Observações da sessão</span><textarea id="sessObs" placeholder="Como foi o treino? Exercício que travou, desconforto, ajuste de máquina...">${esc(sessao?.obs || "")}</textarea></label>
      <p class="small muted">${esc(primeiroNome((PROF || PROF_PADRAO).nome))} lê estas observações. Em caso de dor no peito, tontura, falta de ar desproporcional ou dor articular aguda, pare o treino e avise na hora.</p></div>`;
}
